<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Elemental — from the desk to the quark</title>
<style>
  :root{
    --paper:#f4ecda; --paper-shade:#e6dbc2;
    --ink:#221b12; --ink-soft:#5e5442; --accent:#b5502f;
    --cat-alkali:#e0765a; --cat-alkaline:#dfa14a; --cat-transition:#c9a53b;
    --cat-post:#6fae7a; --cat-metalloid:#4f9e94; --cat-nonmetal:#4f8fbf;
    --cat-halogen:#7a7ec9; --cat-noble:#9a6fc9; --cat-lanth:#c96fa8; --cat-actin:#c9536f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#140d08;font-family:Georgia,'Iowan Old Style',serif;}

  /* ============ DESK ============ */
  #desk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(88deg,rgba(0,0,0,.055) 0 1px,transparent 1px 9px),
      repeating-linear-gradient(92deg,rgba(255,255,255,.028) 0 1px,transparent 1px 23px),
      repeating-linear-gradient(90deg,transparent 0 258px,rgba(0,0,0,.30) 258px 262px),
      radial-gradient(ellipse 120% 90% at 32% 12%,#8a6242 0%,#6b4a33 42%,#46301f 78%,#2a1a10 100%);}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 65% at 50% 46%,transparent 30%,rgba(0,0,0,.30) 68%,rgba(0,0,0,.72) 100%);}
  #lamp{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 48% 40% at 38% 22%,rgba(255,226,175,.20),transparent 70%);}

  #table-wrap{position:relative;width:min(96vw,1460px);
    transition:transform 1s cubic-bezier(.7,0,.25,1),filter .8s ease,opacity .8s ease;will-change:transform,filter,opacity;}
  #table-wrap.receding{filter:blur(10px) brightness(.5);opacity:0;}

  .under{position:absolute;inset:0;pointer-events:none;border-radius:3px;background:#e8dcc4;
    box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .under.u1{transform:rotate(-1.4deg) translate(-7px,5px);background:#e2d5bb}
  .under.u2{transform:rotate(.9deg) translate(6px,8px);background:#d9ccb0}
  #paper{position:relative;z-index:2;padding:clamp(11px,1.5vw,24px) clamp(12px,1.7vw,28px) clamp(14px,1.8vw,24px);
    border-radius:2px 3px 2px 3px;
    background:linear-gradient(112deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,0) 38%),
      radial-gradient(ellipse at 18% 8%,#fbf5e6 0%,var(--paper) 45%,var(--paper-shade) 100%);
    box-shadow:0 2px 3px rgba(0,0,0,.35),0 14px 26px rgba(0,0,0,.42),0 44px 80px rgba(0,0,0,.55),inset 0 0 90px rgba(150,120,70,.10);}
  #paper::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;mix-blend-mode:multiply;
    background:linear-gradient(90deg,transparent 49.6%,rgba(0,0,0,.045) 49.9%,rgba(255,255,255,.35) 50.2%,transparent 50.6%),
      repeating-linear-gradient(72deg,rgba(0,0,0,.014) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(160deg,rgba(0,0,0,.012) 0 1px,transparent 1px 5px);}
  #paper::after{content:"";position:absolute;right:-1px;bottom:-1px;width:58px;height:58px;pointer-events:none;
    background:linear-gradient(315deg,rgba(0,0,0,.20) 0%,rgba(0,0,0,.05) 38%,transparent 60%);border-bottom-right-radius:3px;}
  .hole{position:absolute;left:8px;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#3b2718,#1d1108);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.35);}
  .hole.h1{top:18%}.hole.h2{top:50%}.hole.h3{top:82%}

  .pt-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    border-bottom:1.5px solid var(--ink);padding:0 0 7px 22px;margin-bottom:11px;color:var(--ink);}
  .pt-head h1{font-size:clamp(16px,1.6vw,24px);margin:0;font-weight:600}
  .pt-head p{margin:2px 0 0;font-size:clamp(9px,.8vw,12.5px);color:var(--ink-soft);font-style:italic}
  #tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  #tools input{font-family:Georgia,serif;font-size:clamp(10px,.85vw,13px);padding:5px 9px;border:1px solid var(--ink-soft);
    border-radius:3px;background:rgba(255,255,255,.55);color:var(--ink);width:clamp(84px,9vw,150px)}
  #tools button{font-family:Georgia,serif;font-size:clamp(10px,.85vw,13px);padding:5px 12px;border:1px solid rgba(0,0,0,.4);
    border-radius:3px;background:var(--accent);color:#fff6ec;cursor:pointer}
  #tools button.ghost{background:transparent;color:var(--ink);border-color:var(--ink-soft)}
  #tools button.ghost.on{background:#2e5f52;color:#f0fff9;border-color:#1d3f36}

  #pt-grid{display:grid;grid-template-columns:repeat(18,1fr);gap:clamp(2px,.3vw,5px);margin-left:22px}
  .tile,.tile-ph{aspect-ratio:1/1;border-radius:2px;position:relative;display:flex;flex-direction:column;
    justify-content:space-between;padding:3px 4px;font-family:Georgia,serif;color:#1b140c;
    border:1px solid rgba(0,0,0,.30);overflow:hidden}
  .tile{cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),
      color-mix(in srgb,var(--cat) 34%,var(--paper));
    transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s,background .18s,opacity .25s,filter .25s}
  .tile:hover,.tile:focus-visible{transform:translateY(-3px) scale(1.12);z-index:6;outline:none;
    box-shadow:0 7px 16px rgba(0,0,0,.4);background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%),
      color-mix(in srgb,var(--cat) 58%,var(--paper))}
  .tile.dim{opacity:.20;filter:grayscale(.8)}
  .tile.reactive{box-shadow:0 0 0 2px #2e8f6e,0 0 14px rgba(70,220,170,.65);z-index:4}
  .tile.chosen{box-shadow:0 0 0 3px #b5502f,0 0 18px rgba(230,120,70,.8);z-index:5;transform:scale(1.14)}
  .tile.pulse{animation:pulse 1s ease 2}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(181,80,47,.75)}50%{box-shadow:0 0 0 7px rgba(181,80,47,0)}}
  .tile .num{font-size:clamp(6px,.62vw,10px);opacity:.72;line-height:1}
  .tile .sym{font-size:clamp(11px,1.35vw,21px);font-weight:700;line-height:1;text-align:center}
  .tile .mass{font-size:clamp(5.5px,.55vw,9px);opacity:.68;line-height:1;text-align:right}
  .tile-ph{background:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 4px,transparent 4px 8px);
    border:1px dashed rgba(0,0,0,.32);align-items:center;justify-content:center;font-size:clamp(6px,.6vw,9px);color:var(--ink-soft)}
  #legend{display:flex;flex-wrap:wrap;gap:6px 15px;margin:11px 0 0 22px;padding-top:8px;border-top:1px solid rgba(0,0,0,.22);
    font-size:clamp(8px,.68vw,11px);color:var(--ink-soft)}
  #legend span{display:inline-flex;align-items:center;gap:5px}
  #legend i{width:9px;height:9px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.3)}
  #lab-banner{display:none;margin:9px 0 0 22px;padding:7px 11px;border-radius:5px;background:rgba(46,95,82,.14);
    border:1px solid rgba(46,95,82,.45);color:#1d3f36;font-size:clamp(9px,.8vw,12.5px);font-style:italic}
  body.lab #lab-banner{display:block}

  /* ============ WARP ============ */
  #warp{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0;transition:opacity .25s ease;overflow:hidden}
  #warp.on{opacity:1}
  #warp canvas{position:absolute;inset:0;width:100%;height:100%}
  #scale-ticker{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);text-align:center;
    font-family:'SF Mono',ui-monospace,Menlo,monospace;color:#bfe4ff;text-shadow:0 0 16px rgba(90,180,255,.8)}
  #scale-ticker .big{font-size:clamp(26px,6vw,48px);letter-spacing:1px;line-height:1}
  #scale-ticker .cap{font-size:clamp(10px,2.2vw,13px);opacity:.75;margin-top:7px;letter-spacing:2px;text-transform:uppercase}

  #portal{position:fixed;z-index:59;pointer-events:none;border-radius:2px;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;color:#1b140c;opacity:0;will-change:transform,opacity,border-radius}

  /* ============ 3D SCENES ============ */
  .scene3d{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .45s ease;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
  .scene3d.show{opacity:1;pointer-events:auto}
  #atom-view{background:radial-gradient(ellipse 85% 70% at 50% 42%,#16283f 0%,#0a1420 55%,#03070c 100%)}
  #nucleon-view{background:radial-gradient(ellipse 80% 70% at 50% 45%,#3a1c2c 0%,#16101a 55%,#05040a 100%);z-index:52}
  .scene3d canvas.main{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .scene3d::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:linear-gradient(rgba(150,205,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(150,205,255,.5) 1px,transparent 1px);
    background-size:52px 52px}

  .close-btn{position:absolute;top:16px;right:16px;z-index:20;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(190,220,255,.4);color:#dff0ff;font-size:19px;cursor:pointer;
    backdrop-filter:blur(5px);transition:background .2s,transform .25s}
  .close-btn:hover{background:rgba(255,255,255,.2);transform:rotate(90deg)}
  .zoom-ctl{position:absolute;top:70px;right:16px;z-index:20;display:flex;flex-direction:column;gap:7px}
  .zoom-ctl button{width:44px;height:38px;border-radius:9px;background:rgba(255,255,255,.07);
    border:1px solid rgba(190,220,255,.3);color:#cfe6ff;font-size:15px;cursor:pointer;backdrop-filter:blur(5px);font-family:inherit}
  .zoom-ctl button:active{background:rgba(255,255,255,.2)}
  .zoom-ctl button.fit{font-size:10.5px;letter-spacing:.4px}

  .hud-top{position:absolute;top:18px;left:16px;z-index:15;font-size:11.5px;color:#8fb3d9;letter-spacing:.3px;
    background:rgba(8,16,26,.45);padding:7px 11px;border-radius:7px;border:1px solid rgba(150,205,255,.2);line-height:1.6}
  .hud-top b{color:#dff0ff;font-weight:600}
  #scalebar{margin-top:6px;display:flex;align-items:center;gap:7px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
  #scalebar .bar{width:64px;height:5px;border-left:1px solid #7fd0ff;border-right:1px solid #7fd0ff;border-bottom:1px solid #7fd0ff}

  #nucleus-hint{position:absolute;left:50%;top:52%;transform:translate(-50%,0);z-index:14;pointer-events:none;
    font-size:11.5px;color:#ffd2c0;background:rgba(40,12,8,.5);border:1px solid rgba(255,150,110,.4);
    padding:5px 10px;border-radius:20px;opacity:0;transition:opacity .5s ease}
  #nucleus-hint.on{opacity:.95}

  .info-panel{position:absolute;left:0;bottom:0;z-index:15;width:min(448px,94vw);margin:16px;padding:16px 19px 15px;
    background:rgba(7,15,25,.70);border:1px solid rgba(150,205,255,.26);border-radius:12px;backdrop-filter:blur(10px);
    color:#eaf3ff;transform:translateY(16px);opacity:0;
    transition:transform .55s cubic-bezier(.2,.9,.3,1) .25s,opacity .55s ease .25s;max-height:62vh;overflow-y:auto}
  .show .info-panel{transform:translateY(0);opacity:1}
  .panel-toggle{position:absolute;top:9px;right:10px;width:34px;height:28px;border-radius:7px;cursor:pointer;
    background:rgba(255,255,255,.07);border:1px solid rgba(190,220,255,.28);color:#cfe6ff;font-size:12px;
    font-family:inherit;line-height:1;z-index:3}
  .panel-toggle:active{background:rgba(255,255,255,.18)}
  .info-panel.collapsed{padding-bottom:13px}
  .info-panel.collapsed .stats,.info-panel.collapsed #info-desc,.info-panel.collapsed #lab-cta,
  .info-panel.collapsed #nuc-desc{display:none}
  .info-panel.collapsed #info-sym,.info-panel.collapsed #nuc-sym{font-size:27px}
  .info-panel.collapsed #info-top{margin-bottom:0}
  #lab-toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);z-index:80;opacity:0;
    pointer-events:none;background:rgba(20,12,8,.9);color:#ffe2cf;border:1px solid rgba(255,170,130,.4);
    padding:10px 16px;border-radius:22px;font-family:-apple-system,Arial,sans-serif;font-size:13px;
    transition:opacity .3s ease,transform .3s ease;max-width:88vw;text-align:center}
  #lab-toast.on{opacity:1;transform:translate(-50%,0)}
  #info-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  #info-sym{font-family:Georgia,serif;font-size:42px;font-weight:700;color:#fff;text-shadow:0 0 22px rgba(120,190,255,.6);line-height:1}
  #info-name{font-size:18px;font-weight:600}
  #info-cat{font-size:11.5px;color:#9fc3ec;margin-top:2px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;font-size:12.5px;color:#b9d0e7;margin:9px 0;padding:10px 0;
    border-top:1px solid rgba(150,205,255,.16);border-bottom:1px solid rgba(150,205,255,.16)}
  .stats b{display:block;color:#fff;font-weight:600;font-size:14px;margin-top:1px}
  .stats .wide{grid-column:1/-1}
  #info-desc{font-size:13.5px;line-height:1.5;color:#dbe9f7;font-family:Georgia,serif}
  #lab-cta{margin-top:11px;width:100%;padding:9px;border-radius:8px;border:1px solid rgba(90,220,180,.45);
    background:rgba(40,120,100,.28);color:#c8ffee;font-size:12.5px;cursor:pointer;font-family:inherit}
  #lab-cta:hover{background:rgba(40,120,100,.5)}

  /* ============ REACTION PANEL ============ */
  #rx{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(4,10,16,.78);backdrop-filter:blur(7px);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
  #rx.on{display:flex}
  #rx-card{width:min(560px,94vw);max-height:90vh;overflow-y:auto;background:linear-gradient(180deg,#0e1a27,#0a121c);
    border:1px solid rgba(150,205,255,.3);border-radius:14px;padding:20px;color:#eaf3ff;
    box-shadow:0 30px 80px rgba(0,0,0,.7)}
  #rx-card h2{margin:0 0 3px;font-size:19px;font-family:Georgia,serif}
  #rx-sub{font-size:12px;color:#8fb3d9;margin-bottom:14px}
  #rx-stage{height:150px;position:relative;border-radius:10px;background:radial-gradient(ellipse at 50% 50%,#13273c,#080f18);
    border:1px solid rgba(150,205,255,.18);overflow:hidden;margin-bottom:14px}
  .rxatom{position:absolute;top:50%;width:74px;height:74px;margin-top:-37px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:Georgia,serif;color:#12202e;font-weight:700;transition:all 1.1s cubic-bezier(.6,0,.3,1)}
  .rxatom .s{font-size:25px;line-height:1}
  .rxatom .c{font-size:11px;opacity:.8;margin-top:2px}
  #rxa{left:16%;margin-left:-37px}
  #rxb{left:84%;margin-left:-37px}
  #rx-stage.go #rxa{left:44%;transform:scale(.86)}
  #rx-stage.go #rxb{left:56%;transform:scale(.86)}
  #rx-elec{position:absolute;top:50%;left:16%;width:13px;height:13px;margin:-6px 0 0 -6px;border-radius:50%;
    background:#8fe6ff;box-shadow:0 0 14px #4fc8ff;opacity:0;transition:all 1s ease}
  #rx-stage.go #rx-elec{left:84%;opacity:1}
  #rx-stage.done #rx-elec{opacity:0}
  #rx-product{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-size:36px;color:#fff;opacity:0;transition:opacity .6s ease;text-shadow:0 0 26px rgba(120,220,255,.7)}
  #rx-stage.done #rx-product{opacity:1}
  #rx-stage.done .rxatom{opacity:0;transform:scale(.4)}
  #rx-eq{font-family:ui-monospace,Menlo,monospace;font-size:15px;background:rgba(255,255,255,.05);
    padding:10px 12px;border-radius:8px;border:1px solid rgba(150,205,255,.16);margin-bottom:12px;text-align:center}
  #rx-body{font-size:13.5px;line-height:1.55;font-family:Georgia,serif;color:#dbe9f7}
  #rx-tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}
  #rx-tags span{font-size:11px;padding:4px 9px;border-radius:20px;background:rgba(90,180,255,.14);
    border:1px solid rgba(150,205,255,.3);color:#bcdcff}
  #rx-close{margin-top:16px;width:100%;padding:11px;border-radius:9px;border:1px solid rgba(190,220,255,.35);
    background:rgba(255,255,255,.07);color:#dff0ff;font-size:13px;cursor:pointer;font-family:inherit}
  #rx-close:hover{background:rgba(255,255,255,.16)}

  @media (max-width:760px){
    #table-wrap{width:99vw}
    .tile .num,.tile .mass{display:none}
    .tile .sym{font-size:clamp(9px,2.4vw,15px)}
    .hole{display:none}
    .pt-head,#pt-grid,#legend,#lab-banner{margin-left:0;padding-left:0}
    .info-panel{width:96vw;margin:9px;padding:13px 15px;max-height:54vh}
    #info-sym{font-size:33px}
    .stats{font-size:11.5px}
    #legend{gap:4px 10px}
    .pt-head{flex-direction:column;align-items:stretch;gap:7px}
    #tools{justify-content:flex-start}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="desk">
  <div id="table-wrap">
    <div class="under u2"></div>
    <div class="under u1"></div>
    <div id="paper">
      <div class="hole h1"></div><div class="hole h2"></div><div class="hole h3"></div>
      <div class="pt-head">
        <div>
          <h1>Elemental</h1>
          <p id="subtitle">tap any element to fall into its atom</p>
        </div>
        <div id="tools">
          <input id="search-input" type="text" placeholder="find an element…" autocomplete="off">
          <button id="search-btn">Go</button>
          <button id="lab-btn" class="ghost">Reaction lab</button>
        </div>
      </div>
      <div id="pt-grid"></div>
      <div id="lab-banner">Pick a starting element. Anything it reacts with will light up green.</div>
      <div id="legend"></div>
    </div>
  </div>
  <div id="lamp"></div>
  <div id="vignette"></div>
</div>

<div id="warp">
  <canvas id="warp-canvas"></canvas>
  <div id="scale-ticker"><div class="big"></div><div class="cap"></div></div>
</div>
<div id="portal"><span class="glyph"></span></div>
<div id="lab-toast"></div>

<!-- ATOM -->
<div id="atom-view" class="scene3d">
  <canvas id="atom-canvas" class="main"></canvas>
  <div class="hud-top">
    <div id="shell-label"></div>
    <div id="scalebar"><div class="bar"></div><span id="scaletext"></span></div>
  </div>
  <div id="nucleus-hint">tap the nucleus to go deeper</div>
  <button class="close-btn" id="atom-close" aria-label="Back to the table">✕</button>
  <div class="zoom-ctl">
    <button id="zin">＋</button><button id="zout">－</button><button id="zfit" class="fit">FIT</button>
  </div>
  <div class="info-panel" id="atom-panel">
    <button class="panel-toggle" id="atom-toggle" aria-label="Collapse details">▾</button>
    <div id="info-top">
      <div id="info-sym"></div>
      <div><div id="info-name"></div><div id="info-cat"></div></div>
    </div>
    <div class="stats" id="info-stats"></div>
    <div id="info-desc"></div>
    <button id="lab-cta">See what this reacts with →</button>
  </div>
</div>

<!-- NUCLEON -->
<div id="nucleon-view" class="scene3d">
  <canvas id="nuc-canvas" class="main"></canvas>
  <div class="hud-top">
    <div id="nuc-label"></div>
    <div id="nucscalebar"><div class="bar" style="border-color:#ffab8f"></div><span id="nucscaletext"></span></div>
  </div>
  <button class="close-btn" id="nuc-close" aria-label="Back to the atom">✕</button>
  <div class="zoom-ctl">
    <button id="nzin">＋</button><button id="nzout">－</button><button id="nzfit" class="fit">FIT</button>
  </div>
  <div class="info-panel" id="nuc-panel">
    <button class="panel-toggle" id="nuc-toggle" aria-label="Collapse details">▾</button>
    <div id="info-top"><div id="nuc-sym"></div><div><div id="nuc-name"></div><div id="nuc-cat"></div></div></div>
    <div class="stats" id="nuc-stats"></div>
    <div id="nuc-desc"></div>
  </div>
</div>

<!-- REACTION -->
<div id="rx">
  <div id="rx-card">
    <h2 id="rx-title"></h2>
    <div id="rx-sub"></div>

           isMetal:METAL_CATS.includes(cat),isNoble:cat==="noble"};
  BY_SYM[sym]=d; BY_SYM[sym.toLowerCase()]=d; BY_N[n]=d; ALL.push(d);

    ? `${d.name} — ${partners.length} partners lit up. Tap one to run the reaction. Tap ${d.sym} again to reset.`

function onTile(d,t){
  if(labMode){

    if(d===labA){ labA=null; clearHighlights();
      document.getElementById('lab-banner').textContent="Pick a starting element. Anything it reacts with will light up green."; return; }
    const rx=reactionOf(labA,d);

    return;

function gcd(a,b){return b?gcd(b,a%b):a;}
function posCharge(d){ const p=d.charges.filter(c=>c>0); return p.length?Math.max(...p):null; }
function negCharge(d){ const n=d.charges.filter(c=>c<0); return n.length?Math.min(...n):null; }
function sub(n){ return n===1?"":String(n).replace(/[0-9]/g,c=>"₀₁₂₃₄₅₆₇₈₉"[+c]); }

function reactionOf(a,b){
  if(a===b) return null;
  if(a.isNoble&&b.isNoble) return null;
  // noble gases: only Xe/Kr with F (or O)
  const nobleOk=(x,y)=> !x.isNoble || (["Xe","Kr","Rn"].includes(x.sym)&&["F","O","Cl"].includes(y.sym));
  if(!nobleOk(a,b)||!nobleOk(b,a)) return null;
  if(a.isMetal&&b.isMetal) return null;              // alloys, not compounds
  if(a.en==null||b.en==null) return null;            // unknown → skip
  if(Math.abs(a.en-b.en)<0.10 && !a.isMetal && !b.isMetal) return null;

  // decide who is cation (lower electronegativity)
  const cation = a.en<=b.en ? a : b;
  const anion  = a.en<=b.en ? b : a;
  const pc=posCharge(cation), nc=negCharge(anion);
  if(pc==null||nc==null) return null;
  if(!ANION_STEM[anion.sym]) return null;

  const an=Math.abs(nc);
  const g=gcd(pc,an);
  const nCat=an/g, nAn=pc/g;
  const formula=`${cation.sym}${sub(nCat)}${anion.sym}${sub(nAn)}`;
  const ionic = cation.isMetal;

  let name;
  if(ionic){
    const multi=cation.charges.filter(c=>c>0).length>1;
    name=`${cation.name}${multi?`(${ROMAN[pc]||pc})`:""} ${ANION_STEM[anion.sym]}ide`;
  } else {
    const p1=nCat>1?PREFIX[nCat]:"";
    name=`${p1}${p1?cation.name.toLowerCase():cation.name} ${PREFIX[nAn]||""}${ANION_STEM[anion.sym]}ide`;
  }
  const key=`${cation.sym}|${anion.sym}`, key2=`${anion.sym}|${cation.sym}`;
  const cur=CURATED[key]||CURATED[key2]||null;

  return {
    a:cation,b:anion,ionic,pc,nc,
    formula: cur?cur.f:formula,
    name: cur?cur.name:name.charAt(0).toUpperCase()+name.slice(1),
    body: cur?cur.body:genericBody(cation,anion,ionic,pc,an,cur?cur.f:formula),
    tags: cur?cur.tags:[ionic?"ionic":"covalent", ionic?"electron transfer":"shared electrons", `ΔEN ${Math.abs(a.en-b.en).toFixed(2)}`],
    nCat,nAn
  };
}
function supCharge(q){
  const map={"1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷"};
  const n=Math.abs(q), d=n>1?String(n).replace(/[0-9]/g,c=>map[c]||c):"";
  return d+(q>0?"⁺":"⁻");
}
function genericBody(c,an,ionic,pc,ac,formula){
  if(ionic){
    return `${c.name} holds ${pc} loosely-bound outer electron${pc>1?"s":""}, and ${an.name} needs ${ac} to complete its outer shell. `+
      `Electrons move from ${c.sym} to ${an.sym}, producing ${c.sym}${supCharge(pc)} and ${an.sym}${supCharge(-ac)} ions that lock together by electrostatic attraction. `+
      `The balanced formula ${formula} comes from matching the total positive and negative charge.`;
  }
  return `${c.name} and ${an.name} are both nonmetals, so neither can strip electrons from the other. `+
    `Instead they share pairs — ${c.sym} contributing ${pc} bonding electron${pc>1?"s":""} and each ${an.sym} accepting a share of ${ac}. `+
    `The result, ${formula}, is a discrete molecule rather than a crystal lattice.`;
}

function showReaction(rx){

const tableWrap=document.getElementById('table-wrap');
const atomView=document.getElementById('atom-view');
const nucView=document.getElementById('nucleon-view');
const portal=document.getElementById('portal'),portalGlyph=portal.querySelector('.glyph');
const warp=document.getElementById('warp'),warpCanvas=document.getElementById('warp-canvas');
const tickBig=document.querySelector('#scale-ticker .big'),tickCap=document.querySelector('#scale-ticker .cap');
let wctx,wstreaks=[],wraf=null;

const SCALE_STEPS=[
 ["30 cm","a sheet of paper"],["1 cm","a fingernail"],["1 mm","a grain of sand"],
 ["100 µm","a human hair"],["10 µm","a red blood cell"],["1 µm","a bacterium"],
 ["100 nm","a virus"],["10 nm","a protein"],["1 nm","a DNA strand"],["100 pm","one atom"]
];
const NUC_STEPS=[["100 pm","one atom"],["1 pm","inside the shells"],["100 fm","closing on the nucleus"],["1 fm","a single proton"]];

function initWarp(){
  wctx=warpCanvas.getContext('2d');
  const r=()=>{warpCanvas.width=innerWidth*devicePixelRatio;warpCanvas.height=innerHeight*devicePixelRatio;
    wctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);};
  r();addEventListener('resize',r);
}
function runWarp(steps,dur,hue){
  if(!wctx) initWarp();
  warp.classList.add('on');
  wstreaks=[];
  for(let i=0;i<180;i++){
    wstreaks.push({a:Math.random()*Math.PI*2,r:Math.random()*Math.min(innerWidth,innerHeight)*0.5,
      v:0.6+Math.random()*2.6,len:14+Math.random()*90,w:0.5+Math.random()*1.6,o:0.15+Math.random()*0.6});
  }
  const t0=performance.now();
  cancelAnimationFrame(wraf);
  const cx=innerWidth/2,cy=innerHeight/2;
  const step=()=>{
    const t=(performance.now()-t0)/dur;
    wctx.clearRect(0,0,innerWidth,innerHeight);
    const fade = t<0.15? t/0.15 : (t>0.82? Math.max(0,(1-t)/0.18) : 1);
    wctx.lineCap='round';
    wstreaks.forEach(s=>{
      s.r += s.v*(6+t*46);
      if(s.r>Math.hypot(cx,cy)+120){ s.r=Math.random()*40; }
      const x1=cx+Math.cos(s.a)*s.r, y1=cy+Math.sin(s.a)*s.r;
      const l=s.len*(0.4+t*2.2);
      const x2=cx+Math.cos(s.a)*(s.r-l), y2=cy+Math.sin(s.a)*(s.r-l);
      wctx.strokeStyle=`hsla(${hue},95%,${62+Math.random()*10}%,${s.o*fade})`;
      wctx.lineWidth=s.w;
      wctx.beginPath();wctx.moveTo(x1,y1);wctx.lineTo(x2,y2);wctx.stroke();
    });
    const idx=Math.min(steps.length-1,Math.floor(t*steps.length));
    tickBig.textContent=steps[idx][0];
    tickCap.textContent=steps[idx][1];
    tickBig.style.opacity=tickCap.style.opacity=fade;
    if(t<1) wraf=requestAnimationFrame(step);
    else { warp.classList.remove('on'); wctx.clearRect(0,0,innerWidth,innerHeight); }
  };
  wraf=requestAnimationFrame(step);
}

let currentData=null, lock=0;
function guard(ms){ const now=Date.now(); if(now<lock) return false; lock=now+ms; return true; }
function catColor(cat){ return getComputedStyle(document.documentElement).getPropertyValue(CAT_VAR[cat]).trim(); }

function openElement(d,tileEl){
  if(!guard(420)) return;
  currentData=d;
  const r=tileEl.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  const cx=r.left+r.width/2, cy=r.top+r.height/2;

  tableWrap.style.transformOrigin=`${(cx/vw)*100}% ${(cy/vh)*100}%`;
  requestAnimationFrame(()=>{ tableWrap.style.transform='scale(4.2)'; tableWrap.classList.add('receding'); });

  const col=catColor(d.cat);
  portal.style.transition='none';
  portal.style.left=r.left+'px';portal.style.top=r.top+'px';
  portal.style.width=r.width+'px';portal.style.height=r.height+'px';
  portal.style.background=`radial-gradient(circle at 42% 38%,${col},${col} 45%,rgba(10,22,38,1) 130%)`;
  portal.style.borderRadius='2px';portal.style.transform='translate(0,0) scale(1)';portal.style.opacity='1';
  portalGlyph.textContent=d.sym;portalGlyph.style.fontSize=Math.max(9,r.width*0.55)+'px';
  portalGlyph.style.opacity='1';portalGlyph.style.transition='none';portalGlyph.style.transform='scale(1)';
  const scale=Math.max(vw,vh)*1.6/r.width;
  requestAnimationFrame(()=>{
    portal.style.transition='transform 1.05s cubic-bezier(.62,0,.25,1),opacity .4s ease .7s,border-radius .6s ease';
    portalGlyph.style.transition='opacity .32s ease .04s,transform 1.05s cubic-bezier(.62,0,.25,1)';
    portal.style.borderRadius='50%';
    portal.style.transform=`translate(${vw/2-cx}px,${vh/2-cy}px) scale(${scale})`;
    portalGlyph.style.opacity='0';portalGlyph.style.transform='scale(.35)';
    portal.style.opacity='0';
  });
  runWarp(SCALE_STEPS,1500,205);

  setTimeout(()=>{
    try{ buildAtom(d); }catch(err){ console.error(err); }
    atomView.classList.add('show');
    const hint=document.getElementById('nucleus-hint');
    hint.classList.add('on'); setTimeout(()=>hint.classList.remove('on'),4200);
  },900);
}
document.getElementById('atom-close').onclick=closeAtom;
function closeAtom(){
  if(!guard(420)) return;
  collapsing=true; setTimeout(()=>collapsing=false,700);
  atomView.classList.remove('show');
  setTimeout(()=>{ tableWrap.classList.remove('receding'); tableWrap.style.transform='none'; },240);
}

/* ---- collapsible panels ---- */
let atomCollapsed=false, nucCollapsed=false;
function wirePanel(btnId,panelId,get,set){
  const btn=document.getElementById(btnId),panel=document.getElementById(panelId);
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    set(!get());
    panel.classList.toggle('collapsed',get());
    btn.textContent=get()?"▴":"▾";
    btn.setAttribute('aria-label',get()?"Show details":"Collapse details");
  });
}
wirePanel('atom-toggle','atom-panel',()=>atomCollapsed,v=>atomCollapsed=v);
wirePanel('nuc-toggle','nuc-panel',()=>nucCollapsed,v=>nucCollapsed=v);
function panelWorldOffset(cam,d,panelId){
  if(innerWidth>=760) return 0;
  const p=document.getElementById(panelId);
  if(!p||p.classList.contains('collapsed')) return 0;
  const vF=cam.fov*Math.PI/180;
  const unitsPerPx=(2*Math.tan(vF/2)*d)/innerHeight;
  return (p.getBoundingClientRect().height*0.5)*unitsPerPx;
}

/* ================= THREE: ATOM ================= */
let renderer,scene,camera,root,glowTex;
let rotY=.5,rotX=-.18,autoRot=true,dragging=false,lastX=0,lastY=0;
let dist=14,targetDist=14,fitDist=14,minDist=2,maxDist=90;
let shells=[],bloom=0,nucleusGroup=null,nucHit=null,collapsing=false,outerRadius=10;
let raycaster,pointerNDC;

function makeGlow(c1,c2){
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)');grd.addColorStop(.22,c1);grd.addColorStop(.55,c2);
  grd.addColorStop(1,'rgba(40,90,200,0)');
  g.fillStyle=grd;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);
}
function initAtom(){
  const canvas=document.getElementById('atom-canvas');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42,1,.1,600);
  glowTex=makeGlow('rgba(160,220,255,.75)','rgba(90,160,255,.22)');
  raycaster=new THREE.Raycaster(); pointerNDC=new THREE.Vector2();
  scene.add(new THREE.AmbientLight(0x93b4d6,.7));
  const k=new THREE.PointLight(0xcfe8ff,1.25);k.position.set(9,12,14);scene.add(k);
  const f=new THREE.PointLight(0xff8b62,.55);f.position.set(-13,-8,-10);scene.add(f);
  scene.add(starfield(0x8fbfe8));
  resizeAtom();addEventListener('resize',resizeAtom);
  controls(canvas,
    v=>{targetDist=clamp(v,minDist,maxDist)},()=>targetDist,
    (dx,dy)=>{rotY+=dx*.0065;rotX=clamp(rotX+dy*.0065,-1.35,1.35);autoRot=false;},
    e=>tryNucleusTap(e));
  document.getElementById('zin').onclick=()=>targetDist=clamp(targetDist*.78,minDist,maxDist);
  document.getElementById('zout').onclick=()=>targetDist=clamp(targetDist*1.28,minDist,maxDist);
  document.getElementById('zfit').onclick=()=>{targetDist=fitDist;rotX=-.18;autoRot=true;};
  loopAtom();
}
function starfield(col){
  const g=new THREE.BufferGeometry(),p=[];
  for(let i=0;i<420;i++){const rad=90+Math.random()*180,th=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);
    p.push(rad*Math.sin(ph)*Math.cos(th),rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph));}
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  return new THREE.Points(g,new THREE.PointsMaterial({color:col,size:.9,transparent:true,opacity:.5}));
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function resizeAtom(){
  if(!renderer)return;
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  if(currentData)computeFit();
}
function controls(canvas,setD,getD,onDrag,onTap){
  const pts=new Map();let pd0=0,d0=0,moved=0,downT=0;
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;moved=0;downT=Date.now();}
    if(pts.size===2){dragging=false;pd0=pdist(pts);d0=getD();}
  });
  canvas.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pd0>0){setD(d0*(pd0/pdist(pts)));return;}
    if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;moved+=Math.abs(dx)+Math.abs(dy);
      onDrag(dx,dy);lastX=e.clientX;lastY=e.clientY;}
  });
  const end=e=>{
    if(pts.size===1&&moved<7&&Date.now()-downT<400&&onTap) onTap(e);
    pts.delete(e.pointerId);if(pts.size<2)pd0=0;if(!pts.size)dragging=false;
  };
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);dragging=false;});
  canvas.addEventListener('wheel',e=>{e.preventDefault();setD(getD()*(1+e.deltaY*.0012));},{passive:false});
}
function pdist(m){const a=[...m.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}

function disposeGroup(g){
  if(!g)return;scene.remove(g);
  g.traverse(o=>{if(o.geometry)o.geometry.dispose();
    if(o.material){Array.isArray(o.material)?o.material.forEach(m=>m.dispose()):o.material.dispose();}});
}
function computeFit(){
  const vF=camera.fov*Math.PI/180;
  const hF=2*Math.atan(Math.tan(vF/2)*camera.aspect);
  const pad=innerWidth<760?1.45:1.32;
  fitDist=clamp(Math.max(outerRadius/Math.tan(vF/2),outerRadius/Math.tan(hF/2))*pad,4,400);
  minDist=Math.max(1.2,outerRadius*.10);maxDist=fitDist*5;
}
function buildAtom(d){
  if(!renderer)initAtom();
  disposeGroup(root);
  root=new THREE.Group();scene.add(root);
  shells=[];bloom=0;rotY=.5;rotX=-.18;autoRot=true;collapsing=false;

  const protons=d.n,neutrons=Math.max(0,Math.round(d.mass)-d.n),total=protons+neutrons;
  nucleusGroup=new THREE.Group();
  const coreR=.42+Math.cbrt(total)*.20;
  const ng=new THREE.SphereGeometry(.19,10,10);
  const pM=new THREE.MeshStandardMaterial({color:0xff6b5e,roughness:.34,metalness:.12,emissive:0x5a1208,emissiveIntensity:.45});
  const nM=new THREE.MeshStandardMaterial({color:0xc3ccd8,roughness:.42,metalness:.2,emissive:0x141922,emissiveIntensity:.3});
  const cap=300,k=total>cap?cap/total:1;
  const pN=Math.max(1,Math.round(protons*k)),nN=Math.max(1,Math.round(neutrons*k));
  const pI=new THREE.InstancedMesh(ng,pM,pN),nI=new THREE.InstancedMesh(ng,nM,nN);
  const dum=new THREE.Object3D();
  const rp=()=>{const th=Math.random()*6.283,ph=Math.acos(2*Math.random()-1),rr=coreR*Math.cbrt(Math.random());
    return new THREE.Vector3(rr*Math.sin(ph)*Math.cos(th),rr*Math.sin(ph)*Math.sin(th),rr*Math.cos(ph));};
  for(let i=0;i<pN;i++){dum.position.copy(rp());dum.updateMatrix();pI.setMatrixAt(i,dum.matrix);}
  for(let i=0;i<nN;i++){dum.position.copy(rp());dum.updateMatrix();nI.setMatrixAt(i,dum.matrix);}
  if(neutrons===0) nI.count=0;
  nucleusGroup.add(pI,nI);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffb08a,transparent:true,opacity:.5,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.setScalar(coreR*6.2);nucleusGroup.add(halo);
  nucHit=new THREE.Mesh(new THREE.SphereGeometry(coreR*1.5,12,12),
    new THREE.MeshBasicMaterial({visible:false}));
  nucHit.name="NUCLEUS";nucleusGroup.add(nucHit);
  root.add(nucleusGroup);

  const gap=1.35;
  d.shells.forEach((count,i)=>{
    const radius=coreR+1.9+i*gap*(1+i*.06);
    const pivot=new THREE.Group();
    pivot.rotation.x=.30+i*.44;pivot.rotation.z=i*.37;root.add(pivot);
    const ring=new THREE.Mesh(new THREE.RingGeometry(radius-.012,radius+.012,140),
      new THREE.MeshBasicMaterial({color:0x7fd0ff,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false}));
    ring.rotation.x=Math.PI/2;pivot.add(ring);
    const eG=new THREE.Group(),eGeo=new THREE.SphereGeometry(.17,14,14);
    const eM=new THREE.MeshStandardMaterial({color:0xaef0ff,emissive:0x3aaeff,emissiveIntensity:1.5,roughness:.25});
    const gM=new THREE.SpriteMaterial({map:glowTex,color:0x74d2ff,transparent:true,opacity:.7,
      blending:THREE.AdditiveBlending,depthWrite:false});
    for(let e=0;e<count;e++){
      const a=(e/count)*6.283,h=new THREE.Group();
      const s=new THREE.Mesh(eGeo,eM),gl=new THREE.Sprite(gM.clone());gl.scale.setScalar(1.2);
      h.add(s,gl);h.position.set(Math.cos(a)*radius,0,Math.sin(a)*radius);eG.add(h);
    }
    pivot.add(eG);pivot.scale.setScalar(.001);
    shells.push({pivot,eG,ring,speed:.55/Math.pow(i+1,.9)*(i%2?-1:1),radius,delay:i*.09});
  });
  outerRadius=shells.length?shells[shells.length-1].radius*1.06:coreR*3;
  computeFit();dist=fitDist*2.9;targetDist=fitDist;camera.position.set(0,0,dist);

  // HUD
  document.getElementById('info-sym').textContent=d.sym;
  document.getElementById('info-name').textContent=`${d.name} — #${d.n}`;
  document.getElementById('info-cat').textContent=CAT_LABEL[d.cat];
  document.getElementById('info-stats').innerHTML=`
    <div>Atomic mass<b>${d.mass}</b></div>
    <div>State at 25 °C<b>${stateWord(d.state)}</b></div>
    <div>Protons / Electrons<b>${protons}</b></div>
    <div>Neutrons (approx.)<b>${neutrons}</b></div>
    <div>Group / Period<b>${d.group?d.group:"—"} / ${d.period}</b></div>
    <div>Valence electrons<b>${d.valence}</b></div>
    <div>Common ion charge<b>${chargeText(d)}</b></div>
    <div>Electronegativity<b>${d.en!=null?d.en.toFixed(2):"—"}</b></div>
    <div class="wide">Shell configuration<b>${config(d)}</b></div>`;
  document.getElementById('info-desc').textContent=d.desc;
  document.getElementById('shell-label').innerHTML=`<b>${d.name}</b> · shells ${d.shells.join("–")}`;
}
function tryNucleusTap(e){
  if(!nucHit)return;
  pointerNDC.x=(e.clientX/innerWidth)*2-1;
  pointerNDC.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointerNDC,camera);
  const hits=raycaster.intersectObject(nucHit,true);
  if(hits.length) openNucleon();
}

/* real-scale readout: outer shell ≈ 150 pm */
function updateScaleBar(){
  const pmPerUnit=150/outerRadius;
  const vF=camera.fov*Math.PI/180;
  const widthUnits=2*Math.tan(vF/2)*dist*camera.aspect;
  const barUnits=widthUnits*(64/innerWidth);
  const pm=barUnits*pmPerUnit;
  let txt;
  if(pm>=1000) txt=(pm/1000).toFixed(2)+" nm";
  else if(pm>=1) txt=pm.toFixed(0)+" pm";
  else txt=(pm*1000).toFixed(0)+" fm";
  document.getElementById('scaletext').textContent=txt;
}
function loopAtom(){
  requestAnimationFrame(loopAtom);
  if(!scene)return;
  const dt=.016;
  if(root){
    bloom+=dt;
    shells.forEach(s=>{
      const t=clamp((bloom-s.delay)/.55,0,1),e=1-Math.pow(1-t,3);
      const tgt=collapsing?.001:e;
      s.pivot.scale.setScalar(s.pivot.scale.x+(tgt-s.pivot.scale.x)*.22);
      s.eG.rotation.y+=s.speed*dt;s.ring.material.opacity=.3*e;
    });
    if(nucleusGroup){
      const ns=collapsing?.001:1;
      nucleusGroup.scale.setScalar(nucleusGroup.scale.x+(ns-nucleusGroup.scale.x)*.2);
      nucleusGroup.rotation.y+=dt*.32;nucleusGroup.rotation.x+=dt*.14;
    }
    if(autoRot)rotY+=dt*.13;
    root.rotation.y+=(rotY-root.rotation.y)*.12;
    root.rotation.x+=(rotX-root.rotation.x)*.12;
  }
  dist+=(targetDist-dist)*.085;
  const off=panelWorldOffset(camera,dist,'atom-panel');
  camera.position.set(0,-off,dist);camera.lookAt(0,-off,0);
  updateScaleBar();
  renderer.render(scene,camera);
}

/* ================= THREE: NUCLEON (QUARKS) ================= */
let nRenderer,nScene,nCamera,nRoot,nGlow;
let nRotY=.4,nRotX=-.1,nAuto=true,nDist=9,nTarget=9,nFit=9,nMin=2,nMax=40,nOuter=3.2;
let quarks=[],gluons=[],nucKind="proton";

function initNuc(){
  const canvas=document.getElementById('nuc-canvas');
  nRenderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  nRenderer.setPixelRatio(Math.min(devicePixelRatio,2));
  nScene=new THREE.Scene();
  nCamera=new THREE.PerspectiveCamera(45,1,.1,400);
  nGlow=makeGlow('rgba(255,210,170,.8)','rgba(255,120,80,.25)');
  nScene.add(new THREE.AmbientLight(0xd6a58f,.75));
  const l1=new THREE.PointLight(0xffd9c0,1.3);l1.position.set(7,9,11);nScene.add(l1);
  const l2=new THREE.PointLight(0x7fa8ff,.5);l2.position.set(-9,-6,-8);nScene.add(l2);
  nScene.add(starfield(0xe8a58f));
  const rs=()=>{nRenderer.setSize(innerWidth,innerHeight);nCamera.aspect=innerWidth/innerHeight;
    nCamera.updateProjectionMatrix();nComputeFit();};
  rs();addEventListener('resize',rs);
  controls(canvas,v=>{nTarget=clamp(v,nMin,nMax)},()=>nTarget,
    (dx,dy)=>{nRotY+=dx*.0065;nRotX=clamp(nRotX+dy*.0065,-1.35,1.35);nAuto=false;},null);
  document.getElementById('nzin').onclick=()=>nTarget=clamp(nTarget*.78,nMin,nMax);
  document.getElementById('nzout').onclick=()=>nTarget=clamp(nTarget*1.28,nMin,nMax);
  document.getElementById('nzfit').onclick=()=>{nTarget=nFit;nRotX=-.1;nAuto=true;};
  loopNuc();
}
function nComputeFit(){
  const vF=nCamera.fov*Math.PI/180,hF=2*Math.atan(Math.tan(vF/2)*nCamera.aspect);
  const pad=innerWidth<760?1.5:1.35;
  nFit=clamp(Math.max(nOuter/Math.tan(vF/2),nOuter/Math.tan(hF/2))*pad,3,200);
  nMin=1.2;nMax=nFit*5;
}
function openNucleon(){
  if(!guard(420))return;
  const d=currentData;
  const neutrons=Math.max(0,Math.round(d.mass)-d.n);
  nucKind = (neutrons>0 && Math.random()<0.5) ? "neutron" : "proton";
  runWarp(NUC_STEPS,1250,18);
  setTimeout(()=>{ try{buildNucleon(d);}catch(err){console.error(err);} nucView.classList.add('show'); },760);
}
document.getElementById('nuc-close').onclick=closeNuc;
function closeNuc(){ if(!guard(420))return; nucView.classList.remove('show'); }

function buildNucleon(d){
  if(!nRenderer)initNuc();
  disposeN();
  nRoot=new THREE.Group();nScene.add(nRoot);
  quarks=[];gluons=[];nRotY=.4;nRotX=-.1;nAuto=true;

  const isP=nucKind==="proton";
  // proton = up, up, down ; neutron = up, down, down
  const set = isP? [["u",+2/3],["u",+2/3],["d",-1/3]] : [["u",+2/3],["d",-1/3],["d",-1/3]];
  const cols=[0xff8f6b,0x7fd0ff,0x9be07f];  // "colour charge" r/g/b, illustrative
  const R=1.5;
  const qGeo=new THREE.SphereGeometry(.52,28,28);
  set.forEach((q,i)=>{
    const a=(i/3)*6.283;
    const holder=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:cols[i],roughness:.3,metalness:.15,
      emissive:cols[i],emissiveIntensity:.35});
    const m=new THREE.Mesh(qGeo,mat);
    const g=new THREE.Sprite(new THREE.SpriteMaterial({map:nGlow,color:cols[i],transparent:true,opacity:.6,
      blending:THREE.AdditiveBlending,depthWrite:false}));
    g.scale.setScalar(2.6);
    holder.add(m,g);
    holder.userData={base:new THREE.Vector3(Math.cos(a)*R,Math.sin(a)*R*.55,Math.sin(a*1.7)*R*.5),ph:Math.random()*6.283};
    holder.position.copy(holder.userData.base);
    nRoot.add(holder);quarks.push({holder,type:q[0],charge:q[1]});
  });
  // gluon links
  for(let i=0;i<3;i++){
    const j=(i+1)%3;
    const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
    const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffd9a0,transparent:true,opacity:.55}));
    nRoot.add(line);gluons.push({line,i,j});
  }
  // confinement bubble
  const shell=new THREE.Mesh(new THREE.SphereGeometry(2.55,32,32),
    new THREE.MeshBasicMaterial({color:isP?0xff8a6a:0xa8b6c6,transparent:true,opacity:.09,side:THREE.BackSide}));
  nRoot.add(shell);
  const wire=new THREE.Mesh(new THREE.SphereGeometry(2.56,18,14),
    new THREE.MeshBasicMaterial({color:isP?0xffb098:0xc3ccd8,wireframe:true,transparent:true,opacity:.14}));
  nRoot.add(wire);

  nOuter=3.0;nComputeFit();nDist=nFit*2.6;nTarget=nFit;nCamera.position.set(0,0,nDist);

  const q=isP?"up, up, down":"up, down, down";
  const chg=isP?"+1":"0";
  document.getElementById('nuc-sym').textContent=isP?"p⁺":"n⁰";
  document.getElementById('nuc-name').textContent=isP?"Proton":"Neutron";
  document.getElementById('nuc-cat').textContent=`inside ${d.name} · baryon made of three quarks`;
  document.getElementById('nuc-stats').innerHTML=`
    <div>Quark content<b>${q}</b></div>
    <div>Net charge<b>${chg}</b></div>
    <div>Up quark charge<b>+2/3</b></div>
    <div>Down quark charge<b>−1/3</b></div>
    <div>Held together by<b>Gluons</b></div>
    <div>Diameter<b>≈ 1.7 fm</b></div>`;
  document.getElementById('nuc-desc').textContent = isP
    ? "A proton is not a solid ball. It is three quarks — two up and one down — bound by the strong force, carried by gluons. Add the fractional charges (+2/3 +2/3 −1/3) and you get exactly +1. Pull two quarks apart and the force between them grows rather than fades, so a lone quark has never been observed."
    : "A neutron is one up quark and two down quarks. Their charges (+2/3 −1/3 −1/3) cancel exactly to zero, which is why neutrons add mass to a nucleus without adding charge. Free neutrons are unstable and decay into a proton, an electron and an antineutrino in about 15 minutes.";
  document.getElementById('nuc-label').innerHTML=`<b>${isP?"Proton":"Neutron"}</b> · from the nucleus of ${d.sym}`;
}
function disposeN(){
  if(!nRoot)return;nScene.remove(nRoot);
  nRoot.traverse(o=>{if(o.geometry)o.geometry.dispose();
    if(o.material){Array.isArray(o.material)?o.material.forEach(m=>m.dispose()):o.material.dispose();}});
}
function loopNuc(){
  requestAnimationFrame(loopNuc);
  if(!nScene)return;
  const t=performance.now()/1000;
  if(nRoot){
    quarks.forEach((q,i)=>{
      const b=q.holder.userData.base,ph=q.holder.userData.ph;
      q.holder.position.set(
        b.x+Math.sin(t*1.7+ph)*.28, b.y+Math.cos(t*1.4+ph)*.28, b.z+Math.sin(t*2.1+ph)*.24);
    });
    gluons.forEach(g=>{
      const a=quarks[g.i].holder.position,b=quarks[g.j].holder.position;
      g.line.geometry.setFromPoints([a,b]);
      g.line.material.opacity=.4+.25*Math.sin(t*4+g.i);
    });
    if(nAuto)nRotY+=.0022;
    nRoot.rotation.y+=(nRotY-nRoot.rotation.y)*.12;
    nRoot.rotation.x+=(nRotX-nRoot.rotation.x)*.12;
  }
  nDist+=(nTarget-nDist)*.085;
  const nOff=panelWorldOffset(nCamera,nDist,'nuc-panel');
  nCamera.position.set(0,-nOff,nDist);nCamera.lookAt(0,-nOff,0);
  // scale: nucleon radius 2.55 units ≈ 0.85 fm
  const vF=nCamera.fov*Math.PI/180;
  const widthUnits=2*Math.tan(vF/2)*nDist*nCamera.aspect;
  const fm=widthUnits*(64/innerWidth)*(0.85/2.55);
  document.getElementById('nucscaletext').textContent = fm<1? (fm*1000).toFixed(0)+" am" : fm.toFixed(2)+" fm";
  nRenderer.render(nScene,nCamera);
}
</script>
