<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Elemental — the periodic table, up close</title>
<style>
  :root{
    --paper:#f4ecda;
    --paper-shade:#e6dbc2;
    --ink:#221b12;
    --ink-soft:#5e5442;
    --accent:#b5502f;
    --cat-alkali:#e0765a;
    --cat-alkaline:#dfa14a;
    --cat-transition:#c9a53b;
    --cat-post:#6fae7a;
    --cat-metalloid:#4f9e94;
    --cat-nonmetal:#4f8fbf;
    --cat-halogen:#7a7ec9;
    --cat-noble:#9a6fc9;
    --cat-lanth:#c96fa8;
    --cat-actin:#c9536f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#140d08;
    font-family: Georgia, 'Iowan Old Style', serif;
  }

  /* ================= DESK ================= */
  #desk{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective: 2000px;
    background:
      /* grain */
      repeating-linear-gradient(88deg, rgba(0,0,0,0.055) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(92deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 23px),
      /* plank seams */
      repeating-linear-gradient(90deg, transparent 0 258px, rgba(0,0,0,0.30) 258px 262px),
      /* colour */
      radial-gradient(ellipse 120% 90% at 32% 12%, #8a6242 0%, #6b4a33 42%, #46301f 78%, #2a1a10 100%);
  }
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 75% 65% at 50% 46%, transparent 30%, rgba(0,0,0,0.30) 68%, rgba(0,0,0,0.72) 100%);
  }
  #lamp{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 48% 40% at 38% 22%, rgba(255,226,175,0.20), transparent 70%);
    mix-blend-mode: screen;
  }

  #table-wrap{
    position:relative;
    width: min(96vw, 1460px);
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.7,0,.25,1), filter .75s ease, opacity .75s ease;
    will-change: transform, filter, opacity;
  }
  #table-wrap.receding{
    filter: blur(9px) brightness(.55);
    opacity:0;
  }

  /* paper sheet */
  #paper{
    position:relative;
    background:
      linear-gradient(112deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(ellipse at 18% 8%, #fbf5e6 0%, var(--paper) 45%, var(--paper-shade) 100%);
    padding: clamp(11px,1.5vw,24px) clamp(12px,1.7vw,28px) clamp(14px,1.8vw,24px);
    border-radius: 2px 3px 2px 3px;
    transform: rotateX(7deg) rotateZ(-0.7deg);
    transform-origin: 50% 60%;
    box-shadow:
      0 2px 3px rgba(0,0,0,0.35),
      0 14px 26px rgba(0,0,0,0.42),
      0 44px 80px rgba(0,0,0,0.55),
      inset 0 0 90px rgba(150,120,70,0.10);
  }
  /* fibre texture + faint fold crease */
  #paper::before{
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:
      linear-gradient(90deg, transparent 49.6%, rgba(0,0,0,0.045) 49.9%, rgba(255,255,255,0.35) 50.2%, transparent 50.6%),
      repeating-linear-gradient(72deg, rgba(0,0,0,0.014) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(160deg, rgba(0,0,0,0.012) 0 1px, transparent 1px 5px);
    mix-blend-mode: multiply;
  }
  /* curled lower-right corner lift */
  #paper::after{
    content:""; position:absolute; right:-1px; bottom:-1px;
    width: 58px; height: 58px; pointer-events:none;
    background: linear-gradient(315deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.05) 38%, transparent 60%);
    border-bottom-right-radius: 3px;
  }
  /* punched holes */
  .hole{
    position:absolute; left: 8px; width: 13px; height:13px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #3b2718, #1d1108);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.35);
  }
  .hole.h1{ top: 18%; } .hole.h2{ top: 50%; } .hole.h3{ top: 82%; }

  .pt-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
    border-bottom: 1.5px solid var(--ink);
    padding:0 0 7px 22px; margin-bottom:11px; color:var(--ink);
  }
  .pt-head h1{ font-size: clamp(16px,1.6vw,24px); margin:0; font-weight:600; letter-spacing:.2px;}
  .pt-head p{ margin:2px 0 0; font-size: clamp(9px,.8vw,12.5px); color:var(--ink-soft); font-style:italic;}
  #search-row{ display:flex; gap:7px; }
  #search-row input{
    font-family:Georgia,serif; font-size:clamp(10px,.85vw,13px); padding:5px 9px;
    border:1px solid var(--ink-soft); border-radius:3px;
    background:rgba(255,255,255,.55); color:var(--ink); width:clamp(96px,10vw,160px);
  }
  #search-row button{
    font-family:Georgia,serif; font-size:clamp(10px,.85vw,13px); padding:5px 12px;
    border:1px solid rgba(0,0,0,.4); border-radius:3px;
    background:var(--accent); color:#fff6ec; cursor:pointer;
  }

  #pt-grid{
    display:grid; grid-template-columns: repeat(18, 1fr);
    gap: clamp(2px,.3vw,5px); margin-left:22px;
  }
  .tile,.tile-ph{
    aspect-ratio:1/1; border-radius:2px; position:relative;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:3px 4px; font-family:Georgia,serif; color:#1b140c;
    border:1px solid rgba(0,0,0,.30); overflow:hidden;
  }
  .tile{
    cursor:pointer;
    background:
      linear-gradient(160deg, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
      color-mix(in srgb, var(--cat) 34%, var(--paper));
    transition: transform .18s cubic-bezier(.3,1.4,.5,1), box-shadow .18s ease, background .18s ease;
  }
  .tile:hover,.tile:focus-visible{
    transform: translateY(-3px) scale(1.12); z-index:6; outline:none;
    box-shadow: 0 7px 16px rgba(0,0,0,.4);
    background: linear-gradient(160deg, rgba(255,255,255,.4), rgba(255,255,255,0) 60%),
                color-mix(in srgb, var(--cat) 58%, var(--paper));
  }
  .tile.pulse{ animation: pulse 1s ease 2; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(181,80,47,.75);}
    50%{ box-shadow:0 0 0 7px rgba(181,80,47,0);}
  }
  .tile .num{ font-size:clamp(6px,.62vw,10px); opacity:.72; line-height:1;}
  .tile .sym{ font-size:clamp(11px,1.35vw,21px); font-weight:700; line-height:1; text-align:center;}
  .tile .mass{ font-size:clamp(5.5px,.55vw,9px); opacity:.68; line-height:1; text-align:right;}
  .tile-ph{
    background: repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 4px, transparent 4px 8px);
    border:1px dashed rgba(0,0,0,.32);
    align-items:center; justify-content:center;
    font-size:clamp(6px,.6vw,9px); color:var(--ink-soft);
  }
  #legend{
    display:flex; flex-wrap:wrap; gap:6px 15px; margin:11px 0 0 22px; padding-top:8px;
    border-top:1px solid rgba(0,0,0,.22); font-size:clamp(8px,.68vw,11px); color:var(--ink-soft);
  }
  #legend span{ display:inline-flex; align-items:center; gap:5px;}
  #legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; border:1px solid rgba(0,0,0,.3);}

  /* ================= PORTAL (zoom transition) ================= */
  #portal{
    position:fixed; z-index:60; pointer-events:none;
    border-radius:2px; display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; color:#1b140c;
    opacity:0; will-change: transform, opacity, border-radius;
  }
  #portal .glyph{ line-height:1; }

  /* ================= ATOM VIEW ================= */
  #atom-view{
    position:fixed; inset:0; z-index:50;
    background: radial-gradient(ellipse 85% 70% at 50% 42%, #16283f 0%, #0a1420 55%, #03070c 100%);
    opacity:0; pointer-events:none;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    transition: opacity .45s ease;
  }
  #atom-view.show{ opacity:1; pointer-events:auto; }
  #atom-view::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.05;
    background-image:
      linear-gradient(rgba(150,205,255,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(150,205,255,.5) 1px, transparent 1px);
    background-size:52px 52px;
  }
  #atom-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

  #close-btn{
    position:absolute; top:16px; right:16px; z-index:20;
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(190,220,255,.4);
    color:#dff0ff; font-size:19px; cursor:pointer; backdrop-filter:blur(5px);
    transition:background .2s, transform .25s;
  }
  #close-btn:hover{ background:rgba(255,255,255,.2); transform:rotate(90deg);}

  #zoom-ctl{
    position:absolute; top:70px; right:16px; z-index:20;
    display:flex; flex-direction:column; gap:7px;
  }
  #zoom-ctl button{
    width:44px; height:38px; border-radius:9px;
    background:rgba(255,255,255,.07); border:1px solid rgba(190,220,255,.3);
    color:#cfe6ff; font-size:15px; cursor:pointer; backdrop-filter:blur(5px);
    font-family:inherit;
  }
  #zoom-ctl button:active{ background:rgba(255,255,255,.2);}
  #zoom-ctl button.fit{ font-size:10.5px; letter-spacing:.4px;}

  #shell-label{
    position:absolute; top:18px; left:16px; z-index:15;
    font-size:11.5px; color:#8fb3d9; letter-spacing:.3px;
    background:rgba(8,16,26,.45); padding:7px 11px; border-radius:7px;
    border:1px solid rgba(150,205,255,.2);
  }

  #info-panel{
    position:absolute; left:0; bottom:0; z-index:15;
    width:min(430px,94vw); margin:16px;
    padding:16px 19px 15px;
    background:rgba(7,15,25,.68); border:1px solid rgba(150,205,255,.26);
    border-radius:12px; backdrop-filter:blur(10px); color:#eaf3ff;
    transform:translateY(16px); opacity:0;
    transition: transform .55s cubic-bezier(.2,.9,.3,1) .25s, opacity .55s ease .25s;
  }
  #atom-view.show #info-panel{ transform:translateY(0); opacity:1;}
  #info-top{ display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  #info-sym{ font-family:Georgia,serif; font-size:42px; font-weight:700; color:#fff; text-shadow:0 0 22px rgba(120,190,255,.6); line-height:1;}
  #info-name{ font-size:18px; font-weight:600;}
  #info-cat{ font-size:11.5px; color:#9fc3ec; margin-top:2px;}
  #info-stats{
    display:grid; grid-template-columns:1fr 1fr; gap:7px 16px;
    font-size:12.5px; color:#b9d0e7; margin:9px 0; padding:10px 0;
    border-top:1px solid rgba(150,205,255,.16); border-bottom:1px solid rgba(150,205,255,.16);
  }
  #info-stats b{ display:block; color:#fff; font-weight:600; font-size:14px; margin-top:1px;}
  #info-desc{ font-size:13.5px; line-height:1.5; color:#dbe9f7; font-family:Georgia,serif;}

  @media (max-width:760px){
    #table-wrap{ width:99vw;}
    .tile .num,.tile .mass{ display:none;}
    .tile .sym{ font-size:clamp(9px,2.4vw,15px);}
    .hole{ display:none;}
    .pt-head,#pt-grid,#legend{ margin-left:0; padding-left:0;}
    #info-panel{ width:96vw; margin:9px; padding:13px 15px;}
    #info-sym{ font-size:33px;}
    #info-stats{ font-size:11.5px;}
    #legend{ gap:4px 10px;}
  }
  @media (prefers-reduced-motion: reduce){
    #table-wrap,#atom-view,.tile,#portal{ transition:none !important;}
  }
</style>
</head>
<body>

<div id="desk">
  <div id="table-wrap">
    <div id="paper">
      <div class="hole h1"></div><div class="hole h2"></div><div class="hole h3"></div>
      <div class="pt-head">
        <div>
          <h1>Elemental</h1>
          <p>tap any element to look inside the atom</p>
        </div>
        <div id="search-row">
          <input id="search-input" type="text" placeholder="find an element…" autocomplete="off">
          <button id="search-btn">Go</button>
        </div>
      </div>
      <div id="pt-grid"></div>
      <div id="legend"></div>
    </div>
  </div>
  <div id="lamp"></div>
  <div id="vignette"></div>
</div>

<div id="portal"><span class="glyph"></span></div>

<div id="atom-view">
  <canvas id="atom-canvas"></canvas>
  <div id="shell-label"></div>
  <button id="close-btn" aria-label="Back to the table">✕</button>
  <div id="zoom-ctl">
    <button id="zin" aria-label="Zoom in">＋</button>
    <button id="zout" aria-label="Zoom out">－</button>
    <button id="zfit" class="fit" aria-label="Fit all shells">FIT</button>
  </div>
  <div id="info-panel">
    <div id="info-top">
      <div id="info-sym"></div>
      <div>
        <div id="info-name"></div>
        <div id="info-cat"></div>
      </div>
    </div>
    <div id="info-stats"></div>
    <div id="info-desc"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  const q=document.getElementById('search-input').value.trim().toLowerCase();
  if(!q) return;
  let found=els[q]||null;
  if(!found) for(const k in els){ if(els[k].name.toLowerCase()===q){found=els[k];break;} }

  if(found){
    const tile=grid.querySelector(`.tile[data-sym="${found.sym}"]`);
    tile.classList.add('pulse'); setTimeout(()=>tile.classList.remove('pulse'),2000);

const tableWrap=document.getElementById('table-wrap');
const atomView=document.getElementById('atom-view');
const portal=document.getElementById('portal');
const portalGlyph=portal.querySelector('.glyph');
let busy=false, currentData=null, lastTile=null;

function catColor(cat){
  return getComputedStyle(document.documentElement).getPropertyValue(CAT_VAR[cat]).trim();
}

function openElement(data,tileEl){
  if(busy) return;
  busy=true; currentData=data; lastTile=tileEl;

  const r=tileEl.getBoundingClientRect();
  const vw=innerWidth, vh=innerHeight;
  const cx=r.left+r.width/2, cy=r.top+r.height/2;

  // 1. table dollies toward the clicked tile, blurs out
  tableWrap.style.transformOrigin=`${(cx/vw)*100}% ${(cy/vh)*100}%`;
  requestAnimationFrame(()=>{
    tableWrap.style.transform='scale(3.4)';
    tableWrap.classList.add('receding');
  });

  // 2. portal: the tile itself detaches, flies to centre, swells into a glowing orb
  const col=catColor(data.cat);
  portal.style.transition='none';
  portal.style.left=r.left+'px'; portal.style.top=r.top+'px';
  portal.style.width=r.width+'px'; portal.style.height=r.height+'px';
  portal.style.background=`radial-gradient(circle at 42% 38%, ${col}, ${col} 45%, rgba(10,22,38,1) 130%)`;
  portal.style.borderRadius='2px';
  portal.style.transform='translate(0,0) scale(1)';
  portal.style.opacity='1';
  portalGlyph.textContent=data.sym;
  portalGlyph.style.fontSize=Math.max(9,r.width*0.55)+'px';
  portalGlyph.style.opacity='1';
  portalGlyph.style.transition='none';

  const target=Math.max(vw,vh)*1.5;
  const scale=target/r.width;

  requestAnimationFrame(()=>{
    portal.style.transition='transform .9s cubic-bezier(.66,0,.28,1), opacity .35s ease .62s, border-radius .55s ease';
    portalGlyph.style.transition='opacity .3s ease .05s, transform .9s cubic-bezier(.66,0,.28,1)';
    portal.style.borderRadius='50%';
    portal.style.transform=
      `translate(${vw/2-cx}px, ${vh/2-cy}px) scale(${scale})`;
    portalGlyph.style.opacity='0';
    portalGlyph.style.transform='scale(.4)';
    portal.style.opacity='0';
  });

  // 3. atom view fades up beneath the swelling orb, shells bloom outward
  setTimeout(()=>{
    buildAtom(data);
    atomView.classList.add('show');
  }, 560);
  setTimeout(()=>{ busy=false; }, 1000);
}

document.getElementById('close-btn').addEventListener('click',closeElement);
function closeElement(){
  if(busy) return;
  busy=true;
  collapseAtom();
  atomView.classList.remove('show');
  setTimeout(()=>{
    tableWrap.classList.remove('receding');
    tableWrap.style.transform='scale(1)';
    setTimeout(()=>{ busy=false; }, 1000);
  }, 260);
}

let renderer,scene,camera,root,rafId;
let rotY=0.5, rotX=-0.18, autoRot=true, dragging=false, lastX=0,lastY=0;
let dist=14, targetDist=14, fitDist=14, minDist=2, maxDist=90;
let shells=[], bloomTime=0, nucleusGroup=null;
let glowTex=null;

function makeGlowTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(0.22,'rgba(160,220,255,0.75)');
  grd.addColorStop(0.55,'rgba(90,160,255,0.22)');
  grd.addColorStop(1,'rgba(40,90,200,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

function initThree(){
  const canvas=document.getElementById('atom-canvas');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42,1,0.1,600);
  glowTex=makeGlowTexture();

  scene.add(new THREE.AmbientLight(0x93b4d6,0.7));
  const k=new THREE.PointLight(0xcfe8ff,1.25,0); k.position.set(9,12,14); scene.add(k);
  const f=new THREE.PointLight(0xff8b62,0.55,0); f.position.set(-13,-8,-10); scene.add(f);
  const r=new THREE.DirectionalLight(0x6fa8ff,0.45); r.position.set(-6,4,-9); scene.add(r);

  // starfield for depth
  const sGeo=new THREE.BufferGeometry();
  const pts=[];
  for(let i=0;i<420;i++){
    const rad=90+Math.random()*180;
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pts.push(rad*Math.sin(ph)*Math.cos(th), rad*Math.sin(ph)*Math.sin(th), rad*Math.cos(ph));
  }
  sGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  scene.add(new THREE.Points(sGeo,new THREE.PointsMaterial({color:0x8fbfe8,size:0.9,transparent:true,opacity:0.5})));

  resize(); addEventListener('resize',resize);
  setupControls(canvas);
  loop();
}
function resize(){
  if(!renderer) return;
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  if(currentData) computeFit();
}

function setupControls(canvas){
  const pointers=new Map();
  let pinchStart=0, pinchDist0=0;
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){ dragging=true; autoRot=false; lastX=e.clientX; lastY=e.clientY; }
    if(pointers.size===2){ dragging=false; pinchDist0=pDist(pointers); pinchStart=targetDist; }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2 && pinchDist0>0){
      const d=pDist(pointers);
      targetDist=clamp(pinchStart*(pinchDist0/d),minDist,maxDist);
      return;
    }
    if(dragging){
      rotY+=(e.clientX-lastX)*0.0065;
      rotX=clamp(rotX+(e.clientY-lastY)*0.0065,-1.35,1.35);
      lastX=e.clientX; lastY=e.clientY;
    }
  });
  const end=e=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinchDist0=0; if(pointers.size===0) dragging=false; };
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    targetDist=clamp(targetDist*(1+e.deltaY*0.0012),minDist,maxDist);
  },{passive:false});

  document.getElementById('zin').onclick =()=> targetDist=clamp(targetDist*0.78,minDist,maxDist);
  document.getElementById('zout').onclick=()=> targetDist=clamp(targetDist*1.28,minDist,maxDist);
  document.getElementById('zfit').onclick=()=>{ targetDist=fitDist; rotX=-0.18; autoRot=true; };
}
function pDist(m){ const a=[...m.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function disposeRoot(){
  if(!root) return;
  scene.remove(root);
  root.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){ Array.isArray(o.material)?o.material.forEach(m=>m.dispose()):o.material.dispose(); }
  });
}

let outerRadius=10;
function computeFit(){
  const vFov=camera.fov*Math.PI/180;
  const needV=outerRadius/Math.tan(vFov/2);
  const hFov=2*Math.atan(Math.tan(vFov/2)*camera.aspect);
  const needH=outerRadius/Math.tan(hFov/2);
  // panel occupies the lower ~third on phones, so pad more when narrow
  const pad = innerWidth<760 ? 1.55 : 1.30;
  fitDist=clamp(Math.max(needV,needH)*pad, 4, maxDist);
  minDist=Math.max(1.5, outerRadius*0.12);
  maxDist=fitDist*4.5;
}

function buildAtom(data){
  if(!renderer) initThree();
  disposeRoot();
  root=new THREE.Group(); scene.add(root);
  shells=[]; bloomTime=0;
  rotY=0.5; rotX=-0.18; autoRot=true;

  const protons=data.n;
  const neutrons=Math.max(0,Math.round(data.mass)-data.n);
  const total=protons+neutrons;

  /* --- nucleus --- */
  nucleusGroup=new THREE.Group();
  const coreR = 0.42 + Math.cbrt(total)*0.20;
  const nucGeo=new THREE.SphereGeometry(0.19,10,10);
  const pMat=new THREE.MeshStandardMaterial({color:0xff6b5e,roughness:.34,metalness:.12,emissive:0x5a1208,emissiveIntensity:.45});
  const nMat=new THREE.MeshStandardMaterial({color:0xc3ccd8,roughness:.42,metalness:.2,emissive:0x141922,emissiveIntensity:.3});
  const cap=300, k=total>cap?cap/total:1;
  const pN=Math.max(1,Math.round(protons*k)), nN=Math.max(0,Math.round(neutrons*k));
  const pMesh=new THREE.InstancedMesh(nucGeo,pMat,pN);
  const nMesh=new THREE.InstancedMesh(nucGeo,nMat,nN);
  const dum=new THREE.Object3D();
  const pt=()=>{
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const rr=coreR*Math.cbrt(Math.random());
    return new THREE.Vector3(rr*Math.sin(ph)*Math.cos(th),rr*Math.sin(ph)*Math.sin(th),rr*Math.cos(ph));
  };
  for(let i=0;i<pN;i++){ dum.position.copy(pt()); dum.rotation.set(Math.random()*3,Math.random()*3,0); dum.updateMatrix(); pMesh.setMatrixAt(i,dum.matrix); }
  for(let i=0;i<nN;i++){ dum.position.copy(pt()); dum.rotation.set(Math.random()*3,Math.random()*3,0); dum.updateMatrix(); nMesh.setMatrixAt(i,dum.matrix); }
  nucleusGroup.add(pMesh,nMesh);

  // nucleus halo
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffb08a,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.setScalar(coreR*6.2);
  nucleusGroup.add(halo);
  root.add(nucleusGroup);

  /* --- shells --- */
  const gap = 1.35;
  const eR  = 0.17;
  data.shells.forEach((count,i)=>{
    const radius = coreR + 1.9 + i*gap*(1 + i*0.06);
    const pivot=new THREE.Group();
    pivot.rotation.x = 0.30 + i*0.44;
    pivot.rotation.z = i*0.37;
    root.add(pivot);

    // orbit ring — two-tone for depth
    const ring=new THREE.Mesh(
      new THREE.RingGeometry(radius-0.012,radius+0.012,140),
      new THREE.MeshBasicMaterial({color:0x7fd0ff,transparent:true,opacity:0.30,side:THREE.DoubleSide,depthWrite:false})
    );
    ring.rotation.x=Math.PI/2; pivot.add(ring);

    const eGroup=new THREE.Group();
    const eGeo=new THREE.SphereGeometry(eR,14,14);
    const eMat=new THREE.MeshStandardMaterial({color:0xaef0ff,emissive:0x3aaeff,emissiveIntensity:1.5,roughness:.25,metalness:.1});
    const glowMat=new THREE.SpriteMaterial({map:glowTex,color:0x74d2ff,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false});
    for(let e=0;e<count;e++){
      const ang=(e/count)*Math.PI*2;
      const holder=new THREE.Group();
      const s=new THREE.Mesh(eGeo,eMat);
      const g=new THREE.Sprite(glowMat.clone());
      g.scale.setScalar(eR*7);
      holder.add(s,g);
      holder.position.set(Math.cos(ang)*radius,0,Math.sin(ang)*radius);
      eGroup.add(holder);
    }
    pivot.add(eGroup);

    const speed = 0.55/Math.pow(i+1,0.9) * (i%2===0?1:-1);
    shells.push({pivot,eGroup,ring,speed,radius,count,delay:i*0.09});
    pivot.scale.setScalar(0.001); // bloom in
  });

  outerRadius = shells.length ? shells[shells.length-1].radius*1.06 : coreR*3;
  computeFit();
  dist = fitDist*2.6; targetDist = fitDist;   // pull-in on entry
  camera.position.set(0,0,dist);

  /* --- HUD --- */
  document.getElementById('info-sym').textContent=data.sym;
  document.getElementById('info-name').textContent=`${data.name} — #${data.n}`;
  document.getElementById('info-cat').textContent=CAT_LABEL[data.cat];
  document.getElementById('info-stats').innerHTML=`
    <div>Atomic mass<b>${data.mass}</b></div>
    <div>Protons<b>${protons}</b></div>
    <div>Neutrons (approx.)<b>${neutrons}</b></div>
    <div>Electrons<b>${protons}</b></div>`;
  document.getElementById('info-desc').textContent=data.desc;
  const named=data.shells.map((c,i)=>`${SHELL_NAMES[i]||i+1}:${c}`).join('  ');
  document.getElementById('shell-label').textContent=`shells  ${named}`;
}

let collapsing=false;
function collapseAtom(){ collapsing=true; setTimeout(()=>collapsing=false,700); }

function loop(){
  rafId=requestAnimationFrame(loop);
  if(!scene) return;
  const dt=0.016;

  if(root){
    bloomTime+=dt;
    shells.forEach((s,i)=>{
      const t=clamp((bloomTime-s.delay)/0.55,0,1);
      const e=1-Math.pow(1-t,3);           // easeOutCubic
      const target=collapsing?0.001:e;
      s.pivot.scale.setScalar(s.pivot.scale.x + (target-s.pivot.scale.x)*0.22);
      s.eGroup.rotation.y += s.speed*dt;
      s.ring.material.opacity = 0.30*e;
    });
    if(nucleusGroup){
      const ns=collapsing?0.001:1;
      nucleusGroup.scale.setScalar(nucleusGroup.scale.x+(ns-nucleusGroup.scale.x)*0.2);
      nucleusGroup.rotation.y += dt*0.32;
      nucleusGroup.rotation.x += dt*0.14;
    }
    if(autoRot) rotY += dt*0.13;
    root.rotation.y += (rotY-root.rotation.y)*0.12;
    root.rotation.x += (rotX-root.rotation.x)*0.12;
  }

  dist += (targetDist-dist)*0.085;
  camera.position.set(0,0,dist);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
</script>
